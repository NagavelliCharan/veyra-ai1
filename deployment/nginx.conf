# Veyra AI - Production Nginx Reverse Proxy Configuration
# Terminates TLS (HTTPS), enforces strict CSP, and forwards requests to local Node.js server.
#
# Privacy Guarantee: Does NOT log request bodies, queries, or prompt payloads.

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Anonymized log format: Strip query parameters and sensitive URL fragments
    log_format privy_privacy '$remote_addr - [$time_local] "$request_method $uri" '
                             '$status $body_bytes_sent "$http_referer"';

    access_log /var/log/nginx/access.log privy_privacy;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Rate limiting zone: max 30 requests/minute per client IP
    limit_req_zone $binary_remote_addr zone=privy_api:10m rate=30r/m;

    # Upstream Node.js Express backend
    upstream privy_backend {
        server 127.0.0.1:3001;
        keepalive 32;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name privy.yourdomain.com;
        return 301 https://$host$request_uri;
    }

    # HTTPS Server Block
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name privy.yourdomain.com;

        # TLS Certificates (Configure with Let's Encrypt / Certbot)
        ssl_certificate /etc/letsencrypt/live/privy.yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/privy.yourdomain.com/privkey.pem;

        # Modern TLS Security Parameters
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; object-src 'self' blob: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # Client body limit (protect against memory exhaustion)
        client_max_body_size 100k;

        # API Endpoints (forward to Node.js proxy)
        location /api/ {
            limit_req zone=privy_api burst=10 nodelay;

            proxy_pass http://privy_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        # Static Frontend Application (Single Page App fallback)
        location / {
            proxy_pass http://privy_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
